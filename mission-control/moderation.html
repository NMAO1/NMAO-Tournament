<!doctype html>
<html lang="en"><head>
<meta charset="utf8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NMAO — Duel Moderation</title>
<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const SUPABASE_URL = 'https://oxzuavpyoetchwebdejp.supabase.co';
  const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im94enVhdnB5b2V0Y2h3ZWJkZWpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NjgyNjUsImV4cCI6MjEwMTU0NDI2NX0.SEBXeo_FqsyqV8xS5dwaGymXI6mYPy8-9uMAgaX4fhg';
  window.__mc = { createClient, SUPABASE_URL, ANON };
</script>
<style>
  :root{ --navy:#0e1526; --panel:#16203a; --line:#26324f; --ink:#eaf0fb; --muted:#94a3c4; --gold:#e6b93f; --green:#37c87a; --red:#e5615a; }
  *{box-sizing:border-box} body{margin:0;background:var(--navy);color:var(--ink);font:15px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:26px 18px 60px}
  h1{font-size:24px;margin:0 0 4px} .sub{color:var(--muted);font-size:13px;margin:0 0 20px}
  .btn{border:none;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:13px}
  .btn.gold{background:linear-gradient(160deg,#f0cf80,#e6b93f 55%,#a67c24);color:#141210}
  .btn.green{background:rgba(55,200,120,.15);color:var(--green);border:1px solid rgba(55,200,120,.4)}
  .btn.red{background:rgba(229,97,90,.14);color:var(--red);border:1px solid rgba(229,97,90,.4)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  input{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:#0b1120;color:var(--ink);font-size:15px;margin-bottom:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .duel-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .names{font-weight:800;font-size:16px}
  .pill{font-size:11px;font-weight:800;border-radius:999px;padding:4px 10px;background:rgba(230,185,63,.14);color:var(--gold)}
  .rep{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding:7px 0 0;margin-top:9px}
  .rep b{color:var(--ink)} .vids{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
  .vids a{font-size:12px;color:#8fc0f2;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
  .acts{display:flex;gap:8px} .muted{color:var(--muted)}
  #login{max-width:360px;margin:12vh auto 0}

  /* plain-language help chips — hover or tap the "?" for a manager-friendly explanation */
  .hint{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;
    border:1px solid var(--gold-deep,#9C7A22);background:rgba(230,185,63,.18);color:var(--gold-soft,#FFE488);font-size:11px;font-weight:800;
    cursor:help;position:relative;vertical-align:middle;margin-left:6px;line-height:1;flex:none;user-select:none;
    box-shadow:0 0 0 2px rgba(230,185,63,.10)}
  .hint:hover,.hint:focus{background:var(--gold,#E6B93F);border-color:var(--gold,#E6B93F);color:#141210;box-shadow:0 0 0 3px rgba(230,185,63,.22);outline:none}
  .hint::after{content:attr(data-tip);position:absolute;left:0;top:160%;
    width:max-content;max-width:250px;background:#0e0e12;border:1px solid var(--line,#26262b);border-radius:9px;
    padding:9px 12px;font-size:12px;font-weight:400;line-height:1.5;color:var(--text,#F5F0E8);text-align:left;white-space:normal;
    box-shadow:0 8px 28px rgba(0,0,0,.6);opacity:0;visibility:hidden;transition:opacity .12s;z-index:60;pointer-events:none}
  .hint.r::after{left:auto;right:0}
  .hint:hover::after,.hint:focus::after{opacity:1;visibility:visible}
</style></head>
<body>
<div id="login" style="display:none">
  <h1>Duel Moderation</h1><p class="sub">NMAO staff sign-in.</p>
  <label>Email</label><input id="email" type="email" autocomplete="username">
  <label>Password</label><input id="password" type="password" autocomplete="current-password">
  <button class="btn gold" id="loginBtn" style="width:100%">Sign in</button>
  <p id="loginMsg" class="sub" style="margin-top:10px"></p>
</div>

<div id="app" class="wrap" style="display:none">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <div><h1>Duel Moderation <span class="hint" tabindex="0" role="note" aria-label="Reported duel videos land here. Uphold removes the video AND suspends the competitor who posted it; Dismiss clears the report and returns the duel to voting." data-tip="Reported duel videos land here. Uphold removes the video AND suspends the competitor who posted it; Dismiss clears the report and returns the duel to voting.">?</span></h1><p class="sub">Reported duels awaiting review. Uphold = disqualify (no-contest); Dismiss = back to voting.</p></div>
    <div class="acts"><button class="btn ghost" id="refreshBtn">Refresh</button><button class="btn ghost" id="signoutBtn">Sign out</button></div>
  </div>
  <div id="list"></div>
</div>

<script type="module">
const { createClient, SUPABASE_URL, ANON } = window.__mc;
const sb = createClient(SUPABASE_URL, ANON, { auth: { persistSession: true, autoRefreshToken: true } });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

async function ef(action, body) {
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(`${SUPABASE_URL}/functions/v1/resolve-duel-report`, {
    method: 'POST', headers: { 'Content-Type': 'application/json', apikey: ANON, Authorization: `Bearer ${session?.access_token}` },
    body: JSON.stringify({ action, ...(body || {}) }),
  });
  return res.json();
}

function render(duels) {
  if (!duels.length) { $('list').innerHTML = '<p class="muted">Nothing flagged right now. 🎉</p>'; return; }
  $('list').innerHTML = duels.map((d) => `
    <div class="card" data-id="${d.duel_id}">
      <div class="duel-hd">
        <div class="names">${esc(d.challenger)} <span class="muted">vs</span> ${esc(d.opponent)}</div>
        <div class="acts">
          ${d.wrong_password_count ? `<span class="pill">${d.wrong_password_count} password flag${d.wrong_password_count>1?'s':''}</span>` : ''}
          <button class="btn red" data-act="uphold">Disqualify · no-contest</button>
          <button class="btn green" data-act="dismiss">Dismiss</button>
        </div>
      </div>
      <div class="vids">
        ${d.challenger_video ? `<a href="#" data-vid="${esc(d.challenger_video)}">▶ ${esc(d.challenger)}'s video</a>` : ''}
        ${d.opponent_video ? `<a href="#" data-vid="${esc(d.opponent_video)}">▶ ${esc(d.opponent)}'s video</a>` : ''}
      </div>
      ${d.reports.map((r) => `<div class="rep"><b>${esc(r.reporter)}</b> reported <b>${esc(r.reason)}</b>${r.target && r.target!=='other' ? ` · ${esc(r.target)}` : ''}</div>`).join('')}
    </div>`).join('');
  $('list').querySelectorAll('.card').forEach((card) => {
    const id = card.dataset.id;
    card.querySelectorAll('[data-act]').forEach((b) => {
      b.onclick = async () => {
        if (b.dataset.act === 'uphold' && !confirm('Disqualify this duel as NO-CONTEST? Videos are removed and no ratings change.')) return;
        b.disabled = true;
        const j = await ef(b.dataset.act, { duel_id: id });
        if (j.ok) card.remove(); else { alert(j.error || 'Failed'); b.disabled = false; }
        if (!$('list').children.length) load();
      };
    });
    card.querySelectorAll('[data-vid]').forEach((a) => {
      a.onclick = async (e) => { e.preventDefault(); const p = a.dataset.vid;
        const { data } = await sb.storage.from('entry-videos').createSignedUrl(p.replace(/^.*entry-videos\//, ''), 600).catch(() => ({ data: null }));
        window.open(data?.signedUrl || p, '_blank'); };
    });
  });
}

async function load() {
  $('list').innerHTML = '<p class="muted">Loading…</p>';
  const j = await ef('list');
  if (!j.ok) { $('list').innerHTML = `<p class="muted">${esc(j.error || 'Failed to load')}</p>`; return; }
  render(j.duels || []);
}

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { $('login').style.display = 'none'; $('app').style.display = 'block'; load(); }
  else { $('app').style.display = 'none'; $('login').style.display = 'block'; }
}
$('loginBtn').onclick = async () => {
  $('loginMsg').textContent = 'Signing in…';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  if (error) { $('loginMsg').textContent = error.message; return; }
  boot();
};
$('refreshBtn').onclick = load;
$('signoutBtn').onclick = async () => { await sb.auth.signOut(); location.reload(); };
boot();
</script>
</body></html>
