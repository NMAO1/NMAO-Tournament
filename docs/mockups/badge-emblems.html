<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NMAO — Badge Emblems (colorful)</title>
<style>
  body{margin:0;background:#0b0b0d;color:#F5F0E8;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:26px 16px 60px}
  h1{text-align:center;font-weight:600;font-size:20px;margin:0 0 2px;font-family:Georgia,serif}
  .sub{color:#8f887c;font-size:12px;text-align:center;margin:0 0 8px}
  .cat{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#C9A84C;max-width:920px;margin:24px auto 12px;border-bottom:1px solid #1c1c1f;padding-bottom:6px}
  .wrap{display:flex;flex-wrap:wrap;gap:20px 10px;justify-content:center;max-width:920px;margin:0 auto}
  .cell{width:112px;text-align:center}
  .pin{width:96px;height:96px}
  .nm{font-size:11px;color:#EDE6D8;margin-top:6px;line-height:1.2}.rr{font-size:9px;color:#8f887c}
</style>
</head>
<body>
<h1>NMAO Badge Emblems</h1>
<p class="sub">colorful vector art · dimensional · pin / patch-ready · rarity = frame finish</p>

<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="rimC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C79A"/><stop offset=".55" stop-color="#B87333"/><stop offset="1" stop-color="#6f4318"/></linearGradient>
<linearGradient id="rimU" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EEF1F4"/><stop offset=".55" stop-color="#C9CDD3"/><stop offset="1" stop-color="#8f959c"/></linearGradient>
<linearGradient id="rimR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE488"/><stop offset=".55" stop-color="#E6B93F"/><stop offset="1" stop-color="#9C7A22"/></linearGradient>
<linearGradient id="rimE" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF2E3B"/><stop offset=".5" stop-color="#A32BF7"/><stop offset="1" stop-color="#1F7BFF"/></linearGradient>
<linearGradient id="rimL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2F4F7"/><stop offset=".55" stop-color="#CDD2D9"/><stop offset="1" stop-color="#8A9099"/></linearGradient>
<radialGradient id="scWarm" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#4a3410"/><stop offset="1" stop-color="#140d04"/></radialGradient>
<linearGradient id="scSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2456C9"/><stop offset="1" stop-color="#8FBEFF"/></linearGradient>
<linearGradient id="scDawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a6a"/><stop offset=".55" stop-color="#C96A3A"/><stop offset="1" stop-color="#F2B24A"/></linearGradient>
<radialGradient id="scNight" cx="52%" cy="44%" r="62%"><stop offset="0" stop-color="#3a2f7a"/><stop offset="1" stop-color="#120f2e"/></radialGradient>
<radialGradient id="scRed" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#5a1512"/><stop offset="1" stop-color="#180706"/></radialGradient>
<radialGradient id="scGreen" cx="50%" cy="45%" r="62%"><stop offset="0" stop-color="#16452e"/><stop offset="1" stop-color="#081710"/></radialGradient>
<radialGradient id="scTeal" cx="50%" cy="45%" r="62%"><stop offset="0" stop-color="#0e3d47"/><stop offset="1" stop-color="#06171b"/></radialGradient>
<radialGradient id="scDark" cx="50%" cy="45%" r="62%"><stop offset="0" stop-color="#2a2a34"/><stop offset="1" stop-color="#0c0c0f"/></radialGradient>
<linearGradient id="fGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF0B0"/><stop offset="1" stop-color="#E6B93F"/></linearGradient>
<linearGradient id="fSilver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5F8FC"/><stop offset="1" stop-color="#AEB8C4"/></linearGradient>
<linearGradient id="fRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6A74"/><stop offset="1" stop-color="#B10D1E"/></linearGradient>
<linearGradient id="fBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FC0FF"/><stop offset="1" stop-color="#1F5FCC"/></linearGradient>
<linearGradient id="fGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A6ECBC"/><stop offset="1" stop-color="#2FA05A"/></linearGradient>
<linearGradient id="fPurple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D3A0FF"/><stop offset="1" stop-color="#7A28C4"/></linearGradient>
<linearGradient id="fWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C89A5A"/><stop offset="1" stop-color="#7a4a1e"/></linearGradient>
<linearGradient id="fAmber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD27A"/><stop offset="1" stop-color="#E08A1E"/></linearGradient>
<radialGradient id="burst" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#FFC24A"/><stop offset="1" stop-color="#FF3B2E"/></radialGradient>
<clipPath id="clipDisc"><circle cx="50" cy="50" r="43"/></clipPath>
</defs></svg>

<div class="cat">Batch 1 · First steps · Effort · Growth (1–20)</div>
<div class="wrap" id="b1"></div>

<script>
const SP='<path d="M28,30 l1,2.6 l2.6,1 -2.6,1 -1,2.6 -1,-2.6 -2.6,-1 2.6,-1 Z" fill="#fff"/><path d="M72,60 l.8,2 l2,.8 -2,.8 -.8,2 -.8,-2 -2,-.8 2,-.8 Z" fill="#fff"/>';
const rays='<g fill="#FFD86A" opacity=".2"><path d="M50,50 L44,10 L56,10 Z"/><path d="M50,50 L90,44 L90,56 Z"/><path d="M50,50 L56,90 L44,90 Z"/><path d="M50,50 L10,56 L10,44 Z"/><path d="M50,50 L74,18 L82,26 Z"/><path d="M50,50 L82,74 L74,82 Z"/><path d="M50,50 L26,82 L18,74 Z"/><path d="M50,50 L18,26 L26,18 Z"/></g>';
const yin=(c)=>`<circle cx="50" cy="50" r="17" fill="#0c0c14"/><path d="M50,33 A17,17 0 0,1 50,67 A8.5,8.5 0 0,1 50,50 A8.5,8.5 0 0,0 50,33 Z" fill="${c}"/><circle cx="50" cy="41.5" r="2.8" fill="#0c0c14"/><circle cx="50" cy="58.5" r="2.8" fill="${c}"/>`;
const figure=(x,y,s)=>`<circle cx="${x}" cy="${y}" r="${5*s}" fill="url(#fGold)"/><path d="M${x},${y+5*s} C${x-2},${y+14*s} ${x-6},${y+22*s} ${x+9},${y+24*s}" stroke="url(#fGold)" stroke-width="${6*s}" fill="none" stroke-linecap="round"/><path d="M${x+9},${y+24*s} L${x+13},${y+36*s}" stroke="url(#fGold)" stroke-width="${5*s}" stroke-linecap="round"/><path d="M${x+9},${y+24*s} L${x+4},${y+36*s}" stroke="url(#fGold)" stroke-width="${5*s}" stroke-linecap="round"/>`;

const B=[
['First Step','common','rimC','scGreen',`<rect x="22" y="34" width="56" height="36" rx="7" fill="url(#fGreen)" opacity=".9"/><g stroke="#1c5a38" stroke-width="1" opacity=".5"><line x1="22" y1="46" x2="78" y2="46"/><line x1="22" y1="58" x2="78" y2="58"/><line x1="40" y1="34" x2="40" y2="70"/><line x1="60" y1="34" x2="60" y2="70"/></g><g fill="url(#fGold)"><ellipse cx="50" cy="55" rx="8" ry="12"/><circle cx="43.5" cy="40" r="2.4"/><circle cx="48.5" cy="38" r="2.7"/><circle cx="53.5" cy="38.3" r="2.4"/><circle cx="57.6" cy="40.4" r="1.9"/></g>`+SP],
['First Bow','common','rimC','scWarm',`<ellipse cx="50" cy="70" rx="20" ry="3.6" fill="#000" opacity=".25"/>`+figure(45,36,1)+SP],
['First Reveal','common','rimC','scNight',rays+yin('url(#fGold)')+SP],
['First Reflection','common','rimC','scTeal',`<rect x="26" y="30" width="34" height="42" rx="4" fill="url(#fSilver)" opacity=".92"/><g stroke="#9aa6b2" stroke-width="1.4" opacity=".6"><line x1="31" y1="40" x2="55" y2="40"/><line x1="31" y1="47" x2="55" y2="47"/><line x1="31" y1="54" x2="49" y2="54"/></g><path d="M34,66 C46,50 52,42 64,30 C61,44 53,52 40,64 Z" fill="url(#fGold)"/><circle cx="64" cy="30" r="2.6" fill="#1F7BFF"/>`+SP],
['First Medal','uncommon','rimU','scDark',rays+`<path d="M40,24 L46,54 L50,45 Z" fill="url(#fBlue)"/><path d="M60,24 L54,54 L50,45 Z" fill="#164e9e"/><circle cx="50" cy="60" r="15" fill="url(#fSilver)" stroke="#7d8894" stroke-width="1.5"/><circle cx="50" cy="60" r="15" fill="none" stroke="#fff" stroke-width="1" opacity=".4" stroke-dasharray="1 3"/><path d="M50,52 l2.6,5.3 l5.9,.8 -4.3,4.2 1,5.9 -5.2,-2.8 -5.2,2.8 1,-5.9 -4.3,-4.2 5.9,-.8 Z" fill="#8592a0"/>`+SP],
['First Gold','rare','rimR','scWarm',rays+`<path d="M38,22 L45,55 L50,45 Z" fill="#FF4E5A"/><path d="M62,22 L55,55 L50,45 Z" fill="#B10D1E"/><circle cx="50" cy="61" r="16.5" fill="url(#fGold)" stroke="#7a5a10" stroke-width="1.5"/><path d="M50,52.5 l3,6 l6.6,.9 -4.8,4.7 1.1,6.6 -5.9,-3.1 -5.9,3.1 1.1,-6.6 -4.8,-4.7 6.6,-.9 Z" fill="#8a5e0c"/>`+SP],
['On the Mat','rare','rimR','scGreen',`<rect x="20" y="32" width="60" height="40" rx="8" fill="url(#fGreen)" opacity=".9"/><g stroke="#1c5a38" stroke-width="1" opacity=".5"><line x1="20" y1="52" x2="80" y2="52"/><line x1="50" y1="32" x2="50" y2="72"/></g><g stroke="url(#fGold)" stroke-width="4.5" stroke-linecap="round"><line x1="36" y1="42" x2="36" y2="62"/><line x1="44" y1="42" x2="44" y2="62"/><line x1="52" y1="42" x2="52" y2="62"/><line x1="60" y1="42" x2="60" y2="62"/><line x1="32" y1="62" x2="64" y2="42"/></g>`+SP],
['Nine Bows','rare','rimR','scWarm',`<g fill="url(#fGold)"><circle cx="80" cy="50" r="2.4"/><circle cx="73" cy="69.3" r="2.4"/><circle cx="55.2" cy="79.5" r="2.4"/><circle cx="35" cy="76.3" r="2.4"/><circle cx="21.8" cy="60.3" r="2.4"/><circle cx="21.8" cy="39.7" r="2.4"/><circle cx="35" cy="23.7" r="2.4"/><circle cx="55.2" cy="20.5" r="2.4"/><circle cx="73" cy="30.7" r="2.4"/></g>`+figure(45,38,1)+SP],
['Back on the Mat','uncommon','rimU','scTeal',`<path d="M32,66 C22,54 28,36 50,36 C63,36 68,44 69,50" stroke="url(#fBlue)" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M69,50 l-1,-6 l6,3 z" fill="url(#fBlue)"/><g fill="url(#fGold)"><ellipse cx="32" cy="70" rx="6" ry="4"/><circle cx="27" cy="64" r="1.8"/><circle cx="31" cy="63" r="2"/><circle cx="35" cy="64" r="1.7"/></g>`+SP],
['Early Bird','uncommon','rimU','scDawn',`<line x1="14" y1="62" x2="86" y2="62" stroke="#241a3a" stroke-width="2"/><g stroke="#FFE07A" stroke-width="2" stroke-linecap="round" opacity=".8"><line x1="50" y1="40" x2="50" y2="34"/><line x1="34" y1="46" x2="30" y2="42"/><line x1="66" y1="46" x2="70" y2="42"/><line x1="26" y1="58" x2="20" y2="56"/><line x1="74" y1="58" x2="80" y2="56"/></g><path d="M36,62 A14,14 0 0,1 64,62 Z" fill="url(#fGold)"/><path d="M30,30 Q37,23 43,30 Q49,23 56,30" stroke="#2a1f42" stroke-width="3.4" fill="none" stroke-linecap="round"/><ellipse cx="26" cy="40" rx="7" ry="3" fill="#fff" opacity=".8"/>`+SP],
['Deadline Warrior','uncommon','rimU','scRed',`<rect x="30" y="24" width="40" height="3.4" rx="1.5" fill="url(#fGold)"/><rect x="30" y="70.6" width="40" height="3.4" rx="1.5" fill="url(#fGold)"/><path d="M34,28 H66 L50,49 Z" fill="url(#fAmber)"/><path d="M34,70 H66 L50,49 Z" fill="url(#fAmber)"/><path d="M34,28 H66 L50,49 Z M34,70 H66 L50,49 Z" fill="none" stroke="#E6B93F" stroke-width="1.6"/><circle cx="50" cy="56" r="1.6" fill="#E08A1E"/>`+SP],
['Iron Will','rare','rimR','scRed',`<g fill="url(#fSilver)" stroke="#7d8894" stroke-width="1"><rect x="30" y="44" width="34" height="9" rx="2"/><path d="M64,44 l8,-2 v7 z"/><rect x="44" y="53" width="8" height="8"/><rect x="36" y="61" width="24" height="6" rx="1"/></g><g stroke="#FFC24A" stroke-width="2.4" stroke-linecap="round" opacity=".85"><line x1="40" y1="38" x2="38" y2="33"/><line x1="48" y1="36" x2="48" y2="30"/><line x1="56" y1="38" x2="58" y2="33"/></g>`+SP],
['Perfect Attendance','rare','rimR','scDark',`<rect x="28" y="28" width="44" height="42" rx="5" fill="url(#fSilver)"/><path d="M28,33 a5,5 0 0,1 5,-5 h34 a5,5 0 0,1 5,5 v6 h-44 Z" fill="url(#fRed)"/><rect x="36" y="24" width="4" height="9" rx="2" fill="#9aa6b2"/><rect x="60" y="24" width="4" height="9" rx="2" fill="#9aa6b2"/><g stroke="#2FA05A" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M34,48 l3,3 l5,-6"/><path d="M46,48 l3,3 l5,-6"/><path d="M34,60 l3,3 l5,-6"/></g><path d="M58,55 l1.8,3.7 l4,.6 -2.9,2.8 .7,4 -3.6,-1.9 -3.6,1.9 .7,-4 -2.9,-2.8 4,-.6 Z" fill="#E6B93F"/>`+SP],
['Rising Star','uncommon','rimU','scNight',`<path d="M16,76 Q34,60 46,44" stroke="url(#rimE)" stroke-width="6" fill="none" stroke-linecap="round" opacity=".9"/><path d="M54,22 L58.2,34.2 L71.1,34.4 L60.9,42.2 L64.6,54.6 L54,47.2 L43.4,54.6 L47.2,42.2 L36.9,34.4 L49.8,34.2 Z" fill="url(#fGold)" stroke="#8a6a12" stroke-width="1"/><path d="M50,28 L52,36 L48,36 Z" fill="#fff" opacity=".6"/>`+SP],
['New Heights','uncommon','rimU','scSky',`<circle cx="70" cy="30" r="8" fill="#FFE07A"/><circle cx="70" cy="30" r="12" fill="#FFE07A" opacity=".3"/><g fill="#fff" opacity=".9"><ellipse cx="30" cy="34" rx="9" ry="3.6"/><ellipse cx="36" cy="32" rx="5" ry="3"/></g><path d="M8,78 L32,42 L44,60 L56,36 L78,78 Z" fill="url(#fSilver)"/><path d="M32,42 L26,52 L38,52 Z" fill="#fff"/><path d="M56,36 L49,48 L63,48 Z" fill="#fff"/><line x1="56" y1="36" x2="56" y2="22" stroke="#7a5a2a" stroke-width="1.8"/><path d="M56,22 L67,25.5 L56,29 Z" fill="#FF3B47"/>`],
['Steady Climb','rare','rimR','scSky',`<g fill="url(#fGold)" stroke="#9c7a22" stroke-width="1"><rect x="20" y="58" width="15" height="12"/><rect x="35" y="50" width="15" height="20"/><rect x="50" y="42" width="15" height="28"/><rect x="65" y="34" width="15" height="36"/></g><line x1="72" y1="34" x2="72" y2="22" stroke="#7a5a2a" stroke-width="1.8"/><path d="M72,22 L82,25 L72,28 Z" fill="#FF3B47"/>`+SP],
['Comeback','uncommon','rimU','scRed',`<path d="M40,66 Q44,54 50,60 Q56,54 60,66 Q50,72 40,66 Z" fill="url(#fRed)"/><path d="M26,44 Q42,26 50,22 Q58,26 74,44 Q60,40 50,44 Q40,40 26,44 Z" fill="url(#fAmber)"/><circle cx="50" cy="28" r="3.2" fill="url(#fAmber)"/><path d="M52,27 l3,-1.5 l-3,-1 Z" fill="#E08A1E"/>`+SP],
['Breakthrough','rare','rimR','scRed',`<path d="M50,16 L56,44 L84,50 L56,56 L50,84 L44,56 L16,50 L44,44 Z" fill="url(#burst)" opacity=".85"/><g fill="url(#fWood)" stroke="#5a3512" stroke-width="1"><rect x="22" y="40" width="18" height="20" rx="2" transform="rotate(-8 31 50)"/><rect x="60" y="40" width="18" height="20" rx="2" transform="rotate(8 69 50)"/></g><path d="M52,30 L44,50 L54,53 L46,70" stroke="url(#fGold)" stroke-width="3.4" fill="none" stroke-linecap="round"/>`+SP],
['Rising Floor','uncommon','rimU','scTeal',`<g fill="url(#fBlue)" stroke="#1f5fcc" stroke-width="1"><rect x="26" y="52" width="10" height="18" rx="2"/><rect x="41" y="44" width="10" height="26" rx="2"/><rect x="56" y="34" width="10" height="36" rx="2"/></g><path d="M70,44 v-12" stroke="url(#fGold)" stroke-width="3" stroke-linecap="round"/><path d="M70,30 l-4,5 m4,-5 l4,5" stroke="url(#fGold)" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M22,68 Q34,64 46,68 T70,68" stroke="#fff" stroke-width="1.6" fill="none" opacity=".4"/>`+SP],
['Full Circle','epic','rimE','scNight',`<polygon points="50,20 76,35 76,65 50,80 24,65 24,35" fill="url(#rimE)" opacity=".28"/><polygon points="50,20 76,35 76,65 50,80 24,65 24,35" fill="none" stroke="url(#rimE)" stroke-width="3"/><path d="M40,50 l6,6 l12,-14" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`+SP]
];
document.getElementById('b1').innerHTML=B.map(b=>`<div class="cell"><svg class="pin" viewBox="0 0 100 100"><circle cx="50" cy="50" r="49" fill="url(#${b[2]})"/><circle cx="50" cy="50" r="43" fill="url(#${b[3]})"/><g clip-path="url(#clipDisc)">${b[4]}</g><path d="M26,32 A34,34 0 0,1 74,32" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="5" stroke-linecap="round"/></svg><div class="nm">${b[0]}</div><div class="rr">${b[1]}</div></div>`).join('');
</script>
</body>
</html>
