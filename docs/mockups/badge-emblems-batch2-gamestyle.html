<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NMAO — Badge Emblems Batch 2 (game-achievement style)</title>
<style>
  body{margin:0;background:#0b0b0d;color:#F5F0E8;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:26px 16px 60px}
  h1{text-align:center;font-weight:600;font-size:20px;margin:0 0 2px;font-family:Georgia,serif}
  .sub{color:#8f887c;font-size:12px;text-align:center;margin:0 0 8px}
  .cat{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#C9A84C;max-width:940px;margin:22px auto 12px;border-bottom:1px solid #1c1c1f;padding-bottom:6px}
  .wrap{display:flex;flex-wrap:wrap;gap:16px 8px;justify-content:center;max-width:940px;margin:0 auto}
  .cell{width:114px;text-align:center}
  .nm{font-size:11px;color:#EDE6D8;margin-top:2px;line-height:1.2}.rr{font-size:9px;color:#8f887c}
</style>
</head>
<body>
<h1>NMAO Badge Emblems — Style B</h1>
<p class="sub">"video-game achievement" · starburst medallion · bezel · banner · tier stars</p>

<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="rimC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C79A"/><stop offset=".55" stop-color="#B87333"/><stop offset="1" stop-color="#6f4318"/></linearGradient>
<linearGradient id="rimU" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EEF1F4"/><stop offset=".55" stop-color="#C9CDD3"/><stop offset="1" stop-color="#8f959c"/></linearGradient>
<linearGradient id="rimR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE488"/><stop offset=".55" stop-color="#E6B93F"/><stop offset="1" stop-color="#9C7A22"/></linearGradient>
<linearGradient id="rimE" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF2E3B"/><stop offset=".5" stop-color="#A32BF7"/><stop offset="1" stop-color="#1F7BFF"/></linearGradient>
<linearGradient id="rimL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2F4F7"/><stop offset=".55" stop-color="#CDD2D9"/><stop offset="1" stop-color="#8A9099"/></linearGradient>
<radialGradient id="spotC" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#4a3512"/><stop offset="1" stop-color="#120c06"/></radialGradient>
<radialGradient id="spotU" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#2c3541"/><stop offset="1" stop-color="#0e1116"/></radialGradient>
<radialGradient id="spotR" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#4a3510"/><stop offset="1" stop-color="#140d04"/></radialGradient>
<radialGradient id="spotE" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#2e1c52"/><stop offset="1" stop-color="#100a20"/></radialGradient>
<radialGradient id="spotL" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#2c3038"/><stop offset="1" stop-color="#0e1014"/></radialGradient>
<linearGradient id="banC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B87333"/><stop offset="1" stop-color="#6f4318"/></linearGradient>
<linearGradient id="banU" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#AEB8C4"/><stop offset="1" stop-color="#6a7078"/></linearGradient>
<linearGradient id="banR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6B93F"/><stop offset="1" stop-color="#9C7A22"/></linearGradient>
<linearGradient id="banE" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A32BF7"/><stop offset="1" stop-color="#6712C4"/></linearGradient>
<linearGradient id="banL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CDD2D9"/><stop offset="1" stop-color="#8A9099"/></linearGradient>
<linearGradient id="fGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF0B0"/><stop offset="1" stop-color="#E6B93F"/></linearGradient>
<linearGradient id="fSilver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5F8FC"/><stop offset="1" stop-color="#AEB8C4"/></linearGradient>
<linearGradient id="fBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FC0FF"/><stop offset="1" stop-color="#1F5FCC"/></linearGradient>
<linearGradient id="fGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A6ECBC"/><stop offset="1" stop-color="#2FA05A"/></linearGradient>
<linearGradient id="fPurple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D3A0FF"/><stop offset="1" stop-color="#7A28C4"/></linearGradient>
<linearGradient id="fAmber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD27A"/><stop offset="1" stop-color="#E08A1E"/></linearGradient>
<radialGradient id="burst" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#FFC24A"/><stop offset="1" stop-color="#FF3B2E"/></radialGradient>
<clipPath id="discClip2"><circle cx="50" cy="46" r="28"/></clipPath>
</defs></svg>

<div class="cat">Batch 2 · Mastery · Events · Placement (21–40)</div>
<div class="wrap" id="b2"></div>

<script>
const RAR={common:['rimC','spotC','banC',1],uncommon:['rimU','spotU','banU',1],rare:['rimR','spotR','banR',2],epic:['rimE','spotE','banE',3],legendary:['rimL','spotL','banL',3]};
function frame(rar,icon){
 const r=RAR[rar];
 const star='<polygon points="92,46 75.9,56.7 79.7,75.7 60.7,71.9 50,88 39.3,71.9 20.3,75.7 24.1,56.7 8,46 24.1,35.3 20.3,16.3 39.3,20.1 50,4 60.7,20.1 79.7,16.3 75.9,35.3" fill="url(#'+r[0]+')" stroke="rgba(0,0,0,.3)" stroke-width="1"/>';
 const disc='<circle cx="50" cy="46" r="30.5" fill="#0a0a0f"/><circle cx="50" cy="46" r="28" fill="url(#'+r[1]+')"/>';
 const gloss='<path d="M28,32 A28,28 0 0,1 72,32" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="4.5" stroke-linecap="round"/>';
 const ban='<path d="M22,92 H78 L72,107 L50,100.5 L28,107 Z" fill="url(#'+r[2]+')"/><path d="M22,92 H78 L76,96 H24 Z" fill="rgba(255,255,255,.28)"/>';
 let stars='';const t=r[3];for(let i=0;i<t;i++){const x=50+(i-(t-1)/2)*9;stars+='<path d="M'+x+',5 l1.5,3.1 l3.4,.4 -2.5,2.3 .7,3.4 -3.1,-1.8 -3.1,1.8 .7,-3.4 -2.5,-2.3 3.4,-.4 Z" fill="#FFE07A" stroke="#9c7a22" stroke-width=".4"/>';}
 return '<svg width="94" height="105" viewBox="0 0 100 112">'+star+disc+'<g clip-path="url(#discClip2)">'+icon+'</g>'+gloss+ban+stars+'</svg>';
}
const IC={
 precision:'<g fill="none" stroke="#fff" stroke-width="3"><circle cx="50" cy="44" r="14"/><circle cx="50" cy="44" r="7.5"/></g><circle cx="50" cy="44" r="3" fill="#FF3B47"/><line x1="33" y1="60" x2="50" y2="44" stroke="#FFE07A" stroke-width="3" stroke-linecap="round"/><path d="M50,44 l-6,1 l2,-6 z" fill="#FFE07A"/>',
 kime:'<path d="M50,26 L54,40 L68,44 L54,48 L50,62 L46,48 L32,44 L46,40 Z" fill="url(#burst)" opacity=".8"/><g fill="url(#fGold)" stroke="#7a5a10" stroke-width="1"><rect x="40" y="40" width="22" height="16" rx="4"/><rect x="35" y="45" width="7" height="11" rx="3"/></g><g stroke="#8a5e0c" stroke-width="1.1"><line x1="45" y1="40" x2="45" y2="56"/><line x1="50" y1="40" x2="50" y2="56"/><line x1="55" y1="40" x2="55" y2="56"/></g>',
 rooted:'<circle cx="50" cy="38" r="12" fill="url(#fGreen)"/><rect x="47" y="46" width="6" height="13" rx="1" fill="#7a4a1e"/><path d="M50,59 q-8,2 -12,6 M50,59 q8,2 12,6 M50,59 v6" stroke="#7a4a1e" stroke-width="2.2" fill="none" stroke-linecap="round"/>',
 flow:'<path d="M30,52 q6,-10 12,0 t12,0 t12,0" stroke="url(#fBlue)" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M30,42 q6,-10 12,0 t12,0 t12,0" stroke="#8FC0FF" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>',
 spirit:'<path d="M50,26 C58,36 60,44 56,52 C54,58 46,60 44,54 C42,58 40,50 44,46 C42,52 42,44 47,41 C48,45 50,41 49,35 C53,37 51,30 50,26 Z" fill="url(#burst)"/><path d="M50,40 C54,46 54,52 50,56 C47,52 47,46 50,40 Z" fill="#FFE07A"/>',
 innovator:'<circle cx="50" cy="42" r="11" fill="url(#fGold)"/><rect x="45" y="52" width="10" height="4.5" rx="1" fill="#9c7a22"/><rect x="46.5" y="56.5" width="7" height="3" rx="1" fill="#9c7a22"/><g stroke="#FFE07A" stroke-width="2" stroke-linecap="round" opacity=".7"><line x1="50" y1="26" x2="50" y2="23"/><line x1="64" y1="42" x2="67" y2="42"/><line x1="36" y1="42" x2="33" y2="42"/></g>',
 grandmaster:'<path d="M32,56 L30,34 L40,44 L50,30 L60,44 L70,34 L68,56 Z" fill="url(#fGold)" stroke="#7a5a10" stroke-width="1"/><circle cx="30" cy="34" r="2.5" fill="#FF3B47"/><circle cx="50" cy="30" r="2.5" fill="#FF3B47"/><circle cx="70" cy="34" r="2.5" fill="#FF3B47"/><rect x="32" y="56" width="36" height="4" fill="#9c7a22"/>',
 bothHands:'<line x1="34" y1="58" x2="66" y2="30" stroke="#C0C6CE" stroke-width="3.5" stroke-linecap="round"/><g fill="url(#fGold)" stroke="#7a5a10" stroke-width="1"><rect x="38" y="41" width="20" height="15" rx="4"/><rect x="33" y="46" width="7" height="10" rx="3"/></g>',
 openMind:'<g fill="url(#fPurple)"><path d="M50,54 C44,44 44,34 50,28 C56,34 56,44 50,54 Z"/><path d="M50,54 C40,50 34,42 34,34 C42,36 48,44 50,54 Z"/><path d="M50,54 C60,50 66,42 66,34 C58,36 52,44 50,54 Z"/></g><path d="M36,54 h28" stroke="#7A28C4" stroke-width="2" stroke-linecap="round"/>',
 traditionalist:'<rect x="28" y="28" width="44" height="4" rx="1" fill="#B10D1E"/><g fill="#FF3B47"><rect x="30" y="33" width="40" height="4.5" rx="1"/><rect x="33" y="39" width="34" height="3.5"/><rect x="36" y="37" width="4" height="24"/><rect x="60" y="37" width="4" height="24"/></g>',
 weaponMaster:'<g stroke="#C0C6CE" stroke-width="4" stroke-linecap="round"><line x1="32" y1="58" x2="66" y2="30"/><line x1="68" y1="58" x2="34" y2="30"/></g><g stroke="#7a5a2a" stroke-width="3"><line x1="34" y1="56" x2="40" y2="52"/><line x1="66" y1="56" x2="60" y2="52"/></g>',
 styleExplorer:'<circle cx="50" cy="44" r="14" fill="url(#fSilver)" stroke="#7d8894" stroke-width="1.5"/><path d="M50,44 L57,32 L53,45 Z" fill="#FF3B47"/><path d="M50,44 L43,56 L47,45 Z" fill="#3a3f47"/><circle cx="50" cy="44" r="2" fill="#3a3f47"/>',
 fearless:'<g fill="url(#fAmber)"><ellipse cx="50" cy="50" rx="9" ry="7"/><circle cx="41" cy="41" r="3.4"/><circle cx="50" cy="37" r="3.6"/><circle cx="59" cy="41" r="3.4"/><circle cx="64" cy="48" r="2.7"/></g>',
 podium:'<rect x="44" y="38" width="12" height="22" fill="url(#fGold)"/><rect x="30" y="46" width="12" height="14" fill="#C0C6CE"/><rect x="58" y="50" width="12" height="10" fill="#C8843E"/>',
 goldRush:'<g fill="url(#fGold)" stroke="#9c7a22" stroke-width="1"><ellipse cx="50" cy="56" rx="12" ry="4"/><ellipse cx="50" cy="50" rx="12" ry="4"/><ellipse cx="50" cy="44" rx="12" ry="4"/><ellipse cx="50" cy="38" rx="12" ry="4"/></g>',
 sweep:'<line x1="60" y1="28" x2="44" y2="52" stroke="#C89A5A" stroke-width="3" stroke-linecap="round"/><path d="M44,52 L33,59 L40,45 Z" fill="url(#fAmber)"/>',
 undefeated:'<path d="M50,28 L66,34 V46 C66,56 58,62 50,64 C42,62 34,56 34,46 V34 Z" fill="url(#fBlue)" stroke="#1f5fcc" stroke-width="1.5"/><path d="M44,45 l4,4 l8,-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
 podiumSeason:'<g fill="none" stroke="url(#fGold)" stroke-width="3" stroke-linecap="round"><path d="M38,58 C30,50 30,38 38,30"/><path d="M62,58 C70,50 70,38 62,30"/></g><g fill="url(#fGold)"><ellipse cx="34" cy="41" rx="3" ry="1.6" transform="rotate(-30 34 41)"/><ellipse cx="36" cy="49" rx="3" ry="1.6" transform="rotate(-10 36 49)"/><ellipse cx="66" cy="41" rx="3" ry="1.6" transform="rotate(30 66 41)"/><ellipse cx="64" cy="49" rx="3" ry="1.6" transform="rotate(10 64 49)"/></g><circle cx="50" cy="46" r="4" fill="url(#fGold)"/>',
 goldMedallion:'<g stroke="#FFE07A" stroke-width="1.6" stroke-linecap="round" opacity=".8"><line x1="50" y1="24" x2="50" y2="20"/><line x1="66" y1="30" x2="69" y2="27"/><line x1="71" y1="44" x2="75" y2="44"/><line x1="34" y1="30" x2="31" y2="27"/><line x1="29" y1="44" x2="25" y2="44"/></g><circle cx="50" cy="44" r="14" fill="#1a1508"/><path d="M50,30 A14,14 0 0,1 50,58 A7,7 0 0,1 50,44 A7,7 0 0,0 50,30 Z" fill="url(#fGold)"/><circle cx="50" cy="37" r="2.3" fill="#1a1508"/><circle cx="50" cy="51" r="2.3" fill="url(#fGold)"/>',
 semifinalist:'<g stroke="url(#fGold)" stroke-width="2.6" fill="none" stroke-linecap="round"><path d="M34,32 h6 v12 h7"/><path d="M34,60 h6 v-12 h7"/></g><path d="M58,44 l2.2,4.6 l5,.7 -3.6,3.5 .9,5 -4.5,-2.4 -4.5,2.4 .9,-5 -3.6,-3.5 5,-.7 Z" fill="url(#fGold)"/>'
};
const B2=[['Precision','rare','precision'],['Kime','rare','kime'],['Rooted','rare','rooted'],['Flow','rare','flow'],['Spirit','rare','spirit'],['Innovator','rare','innovator'],['Grandmaster','legendary','grandmaster'],['Both Hands','uncommon','bothHands'],['Open Mind','uncommon','openMind'],['Traditionalist','rare','traditionalist'],['Weapon Master','rare','weaponMaster'],['Style Explorer','uncommon','styleExplorer'],['Fearless','uncommon','fearless'],['Podium','uncommon','podium'],['Gold Rush','rare','goldRush'],['Sweep','epic','sweep'],['Undefeated','rare','undefeated'],['Podium Season','epic','podiumSeason'],['Gold Medallion','legendary','goldMedallion'],['Semifinalist','rare','semifinalist']];
document.getElementById('b2').innerHTML=B2.map(b=>`<div class="cell">${frame(b[1],IC[b[2]])}<div class="nm">${b[0]}</div><div class="rr">${b[1]}</div></div>`).join('');
</script>
</body>
</html>
