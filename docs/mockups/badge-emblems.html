<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NMAO — Badge Emblems (custom vector)</title>
<style>
  body{margin:0;background:#0b0b0d;color:#F5F0E8;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:26px 16px 60px}
  h1{text-align:center;font-weight:600;font-size:20px;margin:0 0 2px;font-family:Georgia,serif}
  .sub{color:#8f887c;font-size:12px;text-align:center;margin:0 0 8px}
  .cat{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#C9A84C;max-width:900px;margin:24px auto 12px;border-bottom:1px solid #1c1c1f;padding-bottom:6px}
  .wrap{display:flex;flex-wrap:wrap;gap:18px 8px;justify-content:center;max-width:900px;margin:0 auto}
  .cell{width:104px;text-align:center}
  .pin{width:84px;height:84px;border-radius:50%;margin:0 auto;padding:3px}
  .disc{width:100%;height:100%;border-radius:50%;background:#0c0c0f;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .disc svg{width:95%;height:95%}
  .r-common{background:linear-gradient(155deg,#E8C79A,#B87333 55%,#6f4318);color:#E8C79A}
  .r-uncommon{background:linear-gradient(155deg,#EEF1F4,#C9CDD3 55%,#8f959c);color:#EDF0F4}
  .r-rare{background:linear-gradient(155deg,#FFE488,#E6B93F 55%,#9C7A22);color:#FFE488}
  .r-epic{background:conic-gradient(from 130deg,#FF2E3B,#C22DE0,#A32BF7,#4B6BFF,#1F7BFF,#A32BF7,#FF2E3B);color:#E0C8FF}
  .r-legendary{background:linear-gradient(155deg,#F2F4F7,#CDD2D9 55%,#8A9099);color:#EAF0F5}
  .nm{font-size:11px;color:#EDE6D8;margin-top:6px;line-height:1.2}.rr{font-size:9px;color:#8f887c}
</style>
</head>
<body>
<h1>NMAO Badge Emblems</h1>
<p class="sub">custom vector line art · scalable · pin / patch-ready · rarity = frame finish</p>
<div class="cat">Batch 1 · First steps · Effort · Growth (1–20)</div>
<div class="wrap" id="b1"></div>

<script>

};
const B1=[
 ['First Step','common','firstStep'],['First Bow','common','firstBow'],['First Reveal','common','firstReveal'],['First Reflection','common','firstReflection'],['First Medal','uncommon','firstMedal'],['First Gold','rare','firstGold'],
 ['On the Mat','rare','onTheMat'],['Nine Bows','rare','nineBows'],['Back on the Mat','uncommon','backOnMat'],['Early Bird','uncommon','earlyBird'],['Deadline Warrior','uncommon','deadline'],['Iron Will','rare','ironWill'],['Perfect Attendance','rare','attendance'],
 ['Rising Star','uncommon','risingStar'],['New Heights','uncommon','newHeights'],['Steady Climb','rare','steadyClimb'],['Comeback','uncommon','comeback'],['Breakthrough','rare','breakthrough'],['Rising Floor','uncommon','risingFloor'],['Full Circle','epic','fullCircle']

document.getElementById('b1').innerHTML=B1.map(b=>`<div class="cell"><div class="pin r-${b[1]}"><div class="disc"><svg viewBox="9 9 42 42">${EM[b[2]]}</svg></div></div><div class="nm">${b[0]}</div><div class="rr">${b[1]}</div></div>`).join('');
</script>
</body>
</html>
