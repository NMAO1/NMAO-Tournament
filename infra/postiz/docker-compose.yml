# Postiz self-host for NMAO social posting.
# Runs the Postiz app + Postgres + Redis + Caddy (automatic HTTPS) on one small VPS.
# See README.md in this folder for the full step-by-step.
services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz
    restart: always
    env_file: .env
    environment:
      # Public URLs (must match your DNS + Caddy host below)
      MAIN_URL: "${POSTIZ_MAIN_URL}"
      FRONTEND_URL: "${POSTIZ_MAIN_URL}"
      NEXT_PUBLIC_BACKEND_URL: "${POSTIZ_MAIN_URL}/api"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      # Security
      JWT_SECRET: "${POSTIZ_JWT_SECRET}"
      # Data stores (internal to this compose network)
      DATABASE_URL: "postgresql://postiz:${POSTIZ_DB_PASSWORD}@postiz-postgres:5432/postiz"
      REDIS_URL: "redis://postiz-redis:6379"
      # Local file storage for uploaded media
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
      IS_GENERAL: "true"
      # After you create your first (owner) login, set this to "true" and re-up
      # so no one else can self-register:
      DISABLE_REGISTRATION: "${POSTIZ_DISABLE_REGISTRATION:-false}"
      # --- Social provider keys (add as you create each developer app) ---
      # FACEBOOK_ID / FACEBOOK_SECRET  (also used for Instagram)
      # X_API_KEY / X_API_SECRET
      # LINKEDIN_CLIENT_ID / LINKEDIN_CLIENT_SECRET
      # YOUTUBE_CLIENT_ID / YOUTUBE_CLIENT_SECRET
      # TIKTOK_CLIENT_ID / TIKTOK_CLIENT_SECRET
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: always
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: "${POSTIZ_DB_PASSWORD}"
      POSTGRES_DB: postiz
    volumes:
      - postiz-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz -d postiz"]
      interval: 10s
      timeout: 5s
      retries: 10

  postiz-redis:
    image: redis:7.2-alpine
    container_name: postiz-redis
    restart: always
    volumes:
      - postiz-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    container_name: postiz-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      POSTIZ_HOST: "${POSTIZ_HOST}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - postiz

volumes:
  postiz-config:
  postiz-uploads:
  postiz-pg:
  postiz-redis:
  caddy-data:
  caddy-config:
